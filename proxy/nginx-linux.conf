# Nginx reverse proxy for EducativeViewer (Linux)
#
# Behavior:
# - Routes known backend API endpoints to Flask (127.0.0.1:5000)
# - Serves all other /api/* paths as static files from STATIC_API_ROOT
# - Routes everything else to Next.js client (127.0.0.1:3000)

upstream educative_client {
    server 127.0.0.1:3000;
    keepalive 32;
}

upstream educative_backend {
    server 127.0.0.1:5000;
    keepalive 32;
}

# 1 => send to Flask backend, 0 => serve from static /api directory
# backend-api-map.generated.conf is produced by:
#   python server/generate_proxy_route_manifest.py
map $uri $is_backend_api {
    default 0;
    include backend-api-map.generated.conf;
}

server {
    listen 80;
    server_name your-domain.com;

    # Put static API assets under: /var/www/educativeviewer/api/
    root /var/www/educativeviewer;

    # Maximum upload size for API calls (adjust as needed)
    client_max_body_size 25m;

    # /api split-routing: known endpoints -> Flask, others -> static files
    location /api/ {
        error_page 418 = @backend_api;

        if ($is_backend_api = 1) {
            return 418;
        }

        try_files $uri $uri/ =404;
    }

    location @backend_api {
        proxy_pass http://educative_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Next.js app (client)
    location / {
        proxy_pass http://educative_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket support (Next.js dev/hot reload and upgrades)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
